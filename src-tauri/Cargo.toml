[package]
name = "litematica-preview"
version = "0.7.0"
edition = "2021"
publish = false
default-run = "LitematicaPreview"

[[bin]]
name = "LitematicaPreview"
path = "src/main.rs"

# The pressure suite runs through `cargo run`, never `cargo test`.
[[bin]]
name = "pressure"
path = "src/bin/pressure.rs"
test = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleation = { version = "0.12.1", features = ["meshing"] }
wgpu = "30.0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
parking_lot = "0.13"
uuid = { version = "1", features = ["v4"] }
litematica-preview-core = "0.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(windows)'.dependencies]
velopack = "=1.2.161"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
