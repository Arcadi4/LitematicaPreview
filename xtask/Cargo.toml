[package]
name = "xtask"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.23"
plist = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
