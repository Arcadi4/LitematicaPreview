name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TARGET_DIR: App/src-tauri/target
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: check_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ -z "$tag" ]]; then
            echo "::error::GITHUB_REF_NAME is empty"
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is malformed. Expected format: vMAJOR.MINOR.PATCH[-PRERELEASE] (e.g. v0.1.0 or v0.1.0-rc.1)"
            exit 1
          fi

          if ! node scripts/bump-version.ts --check "$tag"; then
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists on GitHub. Skipping build and release publication."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$tag" =~ - ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.check_tag.outputs.exists != 'true'
        with:
          version: 12
      - uses: actions/setup-node@v7
        if: steps.check_tag.outputs.exists != 'true'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: App/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check_tag.outputs.exists != 'true'
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.check_tag.outputs.exists != 'true'
        with:
          workspaces: App/src-tauri -> target

      - name: Check Rust formatting
        if: steps.check_tag.outputs.exists != 'true'
        shell: pwsh
        run: |
          cargo fmt --manifest-path Mesher/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path App/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test schematic decoding and meshing
        if: steps.check_tag.outputs.exists != 'true'
        run: cargo test --manifest-path Mesher/Cargo.toml --release --locked --target x86_64-pc-windows-msvc

      - name: Build setup and portable packages
        if: steps.check_tag.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build.ps1 -NonInteractive

      - name: Check frontend formatting
        if: steps.check_tag.outputs.exists != 'true'
        run: pnpm --prefix App run format -- --check

      - name: Test the Tauri host
        if: steps.check_tag.outputs.exists != 'true'
        run: cargo test --manifest-path App/src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc

      - name: Generate package checksums
        if: steps.check_tag.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $artifactsDir = Join-Path (Get-Location) 'artifacts'
          $version = (Get-Content -LiteralPath 'App/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $packageName = "LitematicaPreview-$version-win-x64"
          $releaseAssets = @(
              (Join-Path $artifactsDir "$packageName-setup.exe"),
              (Join-Path $artifactsDir "$packageName-portable.zip")
          )
          foreach ($filePath in $releaseAssets) {
              if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
                  throw "Release package not found: $filePath"
              }
          }
          Write-Host "Generating SHA256SUMS.txt for release assets..."
          $checksumLines = foreach ($filePath in $releaseAssets) {
              $hash = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
              $fileName = Split-Path $filePath -Leaf
              "$hash  $fileName"
          }
          $checksumPath = Join-Path $artifactsDir 'SHA256SUMS.txt'
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding utf8
          Get-Content -LiteralPath $checksumPath | Write-Host

      - uses: actions/upload-artifact@v7
        if: steps.check_tag.outputs.exists != 'true'
        with:
          name: LitematicaPreview-${{ github.ref_name }}-win-x64
          path: |
            artifacts/*-setup.exe
            artifacts/*-portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload build logs
        if: always() && steps.check_tag.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: LitematicaPreview-${{ github.ref_name }}-build-logs
          path: artifacts/logs/
          if-no-files-found: ignore

      - name: Prepare release notes
        if: steps.check_tag.outputs.exists != 'true'
        shell: bash
        run: |
          node --input-type=module - "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md" <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'

          const [, , tag, output] = process.argv
          let notes = ''
          if (existsSync('CHANGELOG.md')) {
            const lines = readFileSync('CHANGELOG.md', 'utf8').replace(/^\uFEFF/, '').split(/\r?\n/)
            const start = lines.findIndex((line) => line.trimEnd() === `# ${tag}`)
            if (start !== -1) {
              const section = []
              let fence = null
              for (const line of lines.slice(start + 1)) {
                const marker = line.match(/^ {0,3}(`{3,}|~{3,})/)
                if (fence) {
                  section.push(line)
                  if (marker && marker[1][0] === fence[0] && marker[1].length >= fence.length &&
                      /^ {0,3}(?:`{3,}|~{3,})[ \t]*$/.test(line)) fence = null
                } else if (marker) {
                  fence = marker[1]
                  section.push(line)
                } else if (/^#(?:[ \t]|$)/.test(line)) {
                  break
                } else {
                  section.push(line.replace(/^#{2,6}(?=[ \t])/, (heading) => heading.slice(1)))
                }
              }
              while (section.length && !section[0].trim()) section.shift()
              while (section.length && !section.at(-1).trim()) section.pop()
              notes = section.join('\n')
            }
          }

          const install = `# How to install

          There are two options for you to install, pick the one you prefer:

          - A one-click installer (\`LitematicaPreview-<version>-win-x64-setup.exe\`): Installs per-user without requiring administrator privileges.
          - A portable .zip package (\`LitematicaPreview-<version>-win-x64-portable.zip\`): Download and extract the portable archive and run LitematicaPreview.exe.`

          writeFileSync(output, `${notes ? `${notes}\n\n` : ''}${install}\n`)
          NODE

      - name: Publish GitHub Release
        if: steps.check_tag.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.check_tag.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"

          version="$(node -p 'require("./App/src-tauri/tauri.conf.json").version')"
          setup_file="artifacts/LitematicaPreview-${version}-win-x64-setup.exe"
          zip_file="artifacts/LitematicaPreview-${version}-win-x64-portable.zip"
          checksum_file="artifacts/SHA256SUMS.txt"

          if [[ ! -f "$setup_file" ]]; then
            echo "::error::Installer file not found"
            exit 1
          fi
          if [[ ! -f "$zip_file" ]]; then
            echo "::error::Portable zip file not found: $zip_file"
            exit 1
          fi
          if [[ ! -f "$checksum_file" ]]; then
            echo "::error::Checksum file not found: $checksum_file"
            exit 1
          fi

          extra_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            extra_flags+=(--prerelease)
          fi

          echo "Publishing release for $tag..."
          gh release create "$tag" \
            "$setup_file" \
            "$zip_file" \
            "$checksum_file" \
            --title "Litematica Preview $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            --verify-tag \
            "${extra_flags[@]}"
