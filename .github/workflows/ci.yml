name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libvulkan1 \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: extractions/setup-just@v4

      - name: Check
        run: just check

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  # A tag cannot restore a cache written by another tag, so release builds only
  # reuse caches written for the default branch. These jobs keep the optimized
  # dependency graph warm on each release image and are the only writers of
  # their cache: `release.yml` restores it with `save-if: false`. A cancelled or
  # failed job writes nothing, because a partially compiled graph cannot replace
  # an existing cache entry.
  release-cache:
    name: Warm release cache (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            shared-key: release-linux
            targets: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            shared-key: release-windows
            targets: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-15
            shared-key: release-macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libvulkan1 \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Configure the Windows static CRT
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ${{ matrix.shared-key }}

      - name: Compile the release binary
        shell: bash
        run: |
          IFS=, read -ra targets <<< "${{ matrix.targets }}"
          for target in "${targets[@]}"; do
            cargo build --release --locked --target "$target" --bin LitematicaPreview
          done
