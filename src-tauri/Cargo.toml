[package]
name = "litematica-preview"
version = "0.3.1"
edition = "2021"
publish = false
default-run = "LitematicaPreview"

[[bin]]
name = "LitematicaPreview"
path = "src/main.rs"

# The pressure suite runs through `cargo run`, never `cargo test`.
[[bin]]
name = "pressure"
path = "src/bin/pressure.rs"
test = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
litematica-preview-core = "0.1.4"
nucleation = { version = "=0.10.14", default-features = false, features = ["meshing"] }
wgpu = "30.0.1"
raw-window-handle = "0.6"
pollster = "1.0.1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
