[package]
name = "litematica-preview-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "litematica_preview_native"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
# Recoverable mesher panics must not cross the C ABI.
panic = "unwind"

[dependencies]
# Preserve the source app's pin: later published meshing releases require
# an unavailable gltf_build API. Upgrade only with seven-format verification.
nucleation = { version = "=0.10.14", default-features = false, features = ["meshing"] }
schematic-mesher = "=0.2.0"
quartz_nbt = { version = "0.2.9", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

