[package]
name = "litematica-preview"
version = "0.8.0"
rust-version = "1.99"
edition = "2024"
publish = false
default-run = "LitematicaPreview"

[[bin]]
name = "LitematicaPreview"
path = "src/main.rs"

[features]
managed-install = []

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "6a68ed75ff14e740eac156d9c2ab5455136d5a37", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "6a68ed75ff14e740eac156d9c2ab5455136d5a37", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
wgpu = { version = "=30.0.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
litematica-preview-core = "0.1.11"
nucleation = { version = "0.12", features = ["meshing"] }
directories = "6"
url = "2"
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "checksums", "github"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tempfile = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSURL", "objc2-core-services"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust"] }
