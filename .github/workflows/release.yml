name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # `check` is the single source of release state. `exists=true` means a
  # previous attempt created the GitHub release, so builds are skipped and the
  # publish job restores the published assets from GitHub to repair the mirror,
  # apt repository, or Homebrew Cask without rebuilding.
  check:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check_tag.outputs.exists }}
      prerelease: ${{ steps.check_tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v4

      - name: Validate release tag
        id: check_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: just release-check "$GITHUB_REF_NAME"

  linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    needs: check
    if: needs.check.outputs.exists != 'true'
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            gnupg \
            libwayland-dev \
            libxkbcommon-dev \
            zsync

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-linux
          save-if: false

      - uses: extractions/setup-just@v4

      - name: Build Debian package and AppImage
        env:
          LP_APT_BASE_URL: ${{ vars.APT_BASE_URL }}
          LP_APT_PUBLIC_KEY: ${{ secrets.APT_GPG_PUBLIC_KEY }}
        shell: bash
        run: just package-linux ${{ needs.check.outputs.prerelease != 'true' && '--apt' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: LitematicaPreview-${{ github.ref_name }}-linux
          path: |
            artifacts/LitematicaPreview-*-x86_64.deb
            artifacts/LitematicaPreview-*-x86_64.AppImage
            artifacts/LitematicaPreview-*-x86_64.AppImage.zsync
          if-no-files-found: error

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    needs: check
    if: needs.check.outputs.exists != 'true'
    env:
      CARGO_TARGET_DIR: target
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-windows
          save-if: false

      - uses: extractions/setup-just@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Install Artifact Signing client
        if: env.ARTIFACT_SIGNING == 'true'
        env:
          ARTIFACT_SIGNING: ${{ secrets.LITEMATICA_WINDOWS_AZURE_SIGN_METADATA != '' }}
        shell: pwsh
        run: nuget install Microsoft.ArtifactSigning.Client -Version 1.0.151 -ExcludeVersion -NonInteractive -OutputDirectory "${{ runner.temp }}/artifact-signing"

      - name: Build signed installer and portable package
        shell: pwsh
        env:
          LITEMATICA_WINDOWS_SIGN_PARAMS: ${{ secrets.LITEMATICA_WINDOWS_SIGN_PARAMS }}
          LITEMATICA_WINDOWS_AZURE_SIGN_METADATA: ${{ secrets.LITEMATICA_WINDOWS_AZURE_SIGN_METADATA }}
          LITEMATICA_WINDOWS_AZURE_SIGN_DLIB: ${{ runner.temp }}/artifact-signing/Microsoft.ArtifactSigning.Client/bin/x64/Azure.CodeSigning.Dlib.dll
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: just package-windows

      - uses: actions/upload-artifact@v7
        with:
          name: LitematicaPreview-${{ github.ref_name }}-windows
          path: |
            artifacts/LitematicaPreview-*-x86_64-setup.exe
            artifacts/LitematicaPreview-*-x86_64-portable.zip
            artifacts/LitematicaPreview-windows-x86_64.exe
          if-no-files-found: error

  macos:
    name: Build macOS packages
    runs-on: macos-15
    needs: check
    if: needs.check.outputs.exists != 'true'
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-macos
          save-if: false

      - uses: extractions/setup-just@v4

      - name: Build and package both architectures
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          LP_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          LP_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          LP_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          LP_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          just package-macos aarch64
          just package-macos x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: LitematicaPreview-${{ github.ref_name }}-macos
          path: |
            artifacts/LitematicaPreview-*-aarch64.dmg
            artifacts/LitematicaPreview-*-x86_64.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-artifacts
      cancel-in-progress: false
    needs: [check, linux, windows, macos]
    # Build failures stop publication; a pre-existing release runs only the
    # idempotent repair path, so skipped builds are expected.
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (needs.check.outputs.exists == 'true' ||
        (needs.linux.result == 'success' &&
         needs.windows.result == 'success' &&
         needs.macos.result == 'success'))
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux packages
        if: needs.check.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: LitematicaPreview-${{ github.ref_name }}-linux
          path: artifacts

      - name: Download Windows packages
        if: needs.check.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: LitematicaPreview-${{ github.ref_name }}-windows
          path: artifacts

      - name: Download macOS packages
        if: needs.check.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: LitematicaPreview-${{ github.ref_name }}-macos
          path: artifacts

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v4

      - name: Install publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends reprepro gnupg
          npm install --global cf@1.0.0-rc.3

      - name: Publish GitHub release, R2 artifacts, and update mirror
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: just release-publish "$GITHUB_REF_NAME"

      - name: Publish apt repository
        if: needs.check.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LP_APT_BASE_URL: ${{ vars.APT_BASE_URL }}
          LP_APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          LP_APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          LP_APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          LP_APT_R2_BUCKET: apt-repo
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: just release-apt "$GITHUB_REF_NAME"

  homebrew:
    name: Publish Homebrew Cask
    needs: [check, publish]
    if: needs.check.outputs.prerelease != 'true' && needs.publish.result == 'success'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
      repair: ${{ needs.check.outputs.exists == 'true' }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
