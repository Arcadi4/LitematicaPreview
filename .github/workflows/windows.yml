name: Windows
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: App/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Native -> target
            App/src-tauri -> target
      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path Native/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path App/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test schematic decoding and meshing
        run: cargo test --manifest-path Native/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
      - name: Build the app and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Check frontend formatting
        working-directory: App
        run: npm exec -- prettier --check src index.html package.json tsconfig.json vite.config.ts
      - name: Test the Tauri host
        run: cargo test --manifest-path App/src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: LitematicaPreview-win-x64
          path: |
            artifacts/win-x64/
            artifacts/*-setup.exe
          if-no-files-found: error
