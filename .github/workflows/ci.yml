name: CI
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend format
        run: pnpm run format:check
      - name: Lint frontend
        run: pnpm run lint
      - name: Test frontend
        run: pnpm run test
  build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TARGET_DIR: target
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check Rust format
        run: pnpm run format:rust
      - name: Test Mesher
        run: pnpm run test:core
      - name: Test App
        run: pnpm run test:host
      - name: Build packages
        run: pnpm exec tsx scripts/build.ts
      - uses: actions/upload-artifact@v7
        with:
          name: LitematicaPreview-win-x64
          path: |
            artifacts/win-x64/
            artifacts/*-setup.exe
            artifacts/*-portable.zip
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LitematicaPreview-build-logs
          path: artifacts/logs/
          if-no-files-found: ignore
