[package]
name = "litematica-preview"
version = "0.4.0"
edition = "2021"
publish = false
default-run = "LitematicaPreview"

[[bin]]
name = "LitematicaPreview"
path = "src/main.rs"

# The pressure suite runs through `cargo run`, never `cargo test`.
[[bin]]
name = "pressure"
path = "src/bin/pressure.rs"
test = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
litematica-preview-core = { git = "https://github.com/Arcadi4/litematica-preview-core", rev = "87838a6dcca60010f2af63dd6c733a5010ec6a27" }
nucleation = { version = "=0.11.0", default-features = false, features = ["meshing"] }
wgpu = "30.0.1"
pollster = "1.0.1"
parking_lot = "0.13"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
